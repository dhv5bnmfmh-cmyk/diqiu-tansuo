<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="地球探索">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>地球探索</title>
<style>
:root{
  --bg:#05080b;--ink:#f7f3ea;--muted:#9da8af;--gold:#e7bd73;
  --glass:rgba(16,22,27,.70);--line:rgba(255,255,255,.10)
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{width:min(470px,100vw);min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;min-height:100vh;position:relative}.screen.active{display:block}
.header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.055)}
.brand{font-size:19px;font-weight:850;letter-spacing:.01em}
.back{border:0;background:transparent;color:#fff;font-size:29px;padding:8px 10px}.blank{width:48px}
.homeTitle{font-size:12px;color:var(--muted);letter-spacing:.14em;padding:36px 22px 10px}
.homeCity{font-size:36px;font-weight:860;padding:18px 22px 26px;cursor:pointer}
.list{padding:6px 22px 34px}
.row{min-height:78px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.075);font-size:22px;font-weight:730;cursor:pointer}
.row:active,.homeCity:active{opacity:.58}.row.disabled{opacity:.3;cursor:default}

/* Beijing story map */
.beijingMap{position:relative;margin:8px 18px 0;height:min(58vh,610px);min-height:430px;border-radius:28px;overflow:hidden;background:#10161a url("assets/maps/beijing.svg") center/cover no-repeat;border:1px solid rgba(255,255,255,.08);box-shadow:0 22px 70px rgba(0,0,0,.32)}
.mapVignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.02) 55%,rgba(3,7,9,.66) 100%);pointer-events:none}
.mapLabel{position:absolute;left:20px;top:18px;font-size:10px;letter-spacing:.18em;color:#b7c0c5;text-transform:uppercase;opacity:.75}
.mapMark{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;color:#f5e4bd;padding:9px;cursor:pointer}
.mapMark .dot{display:block;width:18px;height:18px;border-radius:50%;background:#e7bd73;border:4px solid rgba(245,228,189,.35);box-shadow:0 0 0 7px rgba(231,189,115,.10),0 6px 18px rgba(0,0,0,.38)}
.mapMark .markName{display:block;margin-top:6px;white-space:nowrap;font-size:10px;font-weight:760;text-shadow:0 2px 10px #000}
.mapMark.disabled{opacity:.28;cursor:default}.mapMark.disabled .dot{background:#89949a}
.mapMark:active{opacity:.55}
.storyChoices{padding:14px 22px 30px}
.choice{display:flex;align-items:center;justify-content:space-between;min-height:58px;border-bottom:1px solid rgba(255,255,255,.075);cursor:pointer}
.choice span{font-size:18px;font-weight:730}.choice small{font-size:10px;color:#7f8a91}
.choice.disabled{opacity:.30;cursor:default}
.choice:active{opacity:.58}

/* story */
.story.active{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(470px,100vw);height:100dvh;min-height:100dvh;overflow:hidden;overscroll-behavior:none}
.storyBg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);transition:background-image .6s ease,transform 8s ease}
.story.active .storyBg{transform:scale(1.07)}
.story.speechMode .timeline,.story.speechMode .timeRow{display:none}
.storyShade{position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.01) 34%,rgba(2,5,8,.18) 50%,rgba(2,5,8,.70) 72%,#020508 100%)}
.storyTop{position:absolute;z-index:5;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 17px}
.title{font-size:14px;font-weight:760;text-shadow:0 1px 12px rgba(0,0,0,.65)}
.count{font-size:12px;color:#d2d7da}
.storyText{position:absolute;z-index:4;left:25px;right:25px;bottom:158px}
.scene{font-size:11px;color:var(--gold);letter-spacing:.11em;margin-bottom:10px;font-weight:760}
.body{font-size:21px;line-height:1.68;text-shadow:0 2px 16px rgba(0,0,0,.68)}
.karaChar.future{display:none}.karaChar.visible{display:inline}
.player{position:absolute;z-index:8;left:0;right:0;bottom:0;padding:6px 14px calc(13px + env(safe-area-inset-bottom))}
.playerGlass{
  background:linear-gradient(180deg,rgba(26,32,37,.78),rgba(12,17,21,.91));
  border:1px solid rgba(255,255,255,.11);box-shadow:0 18px 55px rgba(0,0,0,.35);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:26px;padding:12px 14px 10px
}
.timeline{height:3px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin:0 5px 11px}
.timelineBar{height:100%;width:0;background:linear-gradient(90deg,#e6b767,#f2d49a);border-radius:999px}
.timeRow{display:flex;justify-content:space-between;color:#89959c;font-size:10px;margin:0 4px 2px}
.controls{height:64px;display:grid;grid-template-columns:1fr 78px 1fr;align-items:center}
.ctrl{border:0;background:transparent;color:#f5f3ed;font-size:14px;font-weight:760;height:58px;border-radius:18px}
.ctrl:active{background:rgba(255,255,255,.06)}
.ctrl small{display:block;color:#87949b;font-size:9px;font-weight:650;margin-top:3px}
.play{width:58px;height:58px;border-radius:50%;border:0;justify-self:center;background:linear-gradient(145deg,#f0ddb3,#dcb974);color:#1c1711;font-size:22px;font-weight:900;box-shadow:0 7px 24px rgba(226,185,111,.25)}
.status{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:6;font-size:10px;color:#d9dfe2;background:rgba(0,0,0,.32);padding:6px 10px;border-radius:999px;backdrop-filter:blur(12px);opacity:0;transition:.25s;pointer-events:none}
.status.show{opacity:1}

.cinemaMeta{position:absolute;z-index:5;left:22px;top:76px;font-size:9px;letter-spacing:.16em;color:rgba(247,243,234,.72);text-transform:uppercase;text-shadow:0 2px 12px #000}
.sceneNav{position:absolute;z-index:7;left:24px;right:24px;bottom:151px;display:flex;gap:5px;align-items:center}
.sceneDot{height:3px;flex:1;border:0;border-radius:99px;background:rgba(255,255,255,.24);padding:0;cursor:pointer;transition:.2s}
.sceneDot.active{background:#e7bd73;box-shadow:0 0 8px rgba(231,189,115,.35)}
.sceneDot:active{opacity:.55}
.swipeHint{position:absolute;z-index:5;right:22px;top:78px;font-size:9px;color:rgba(247,243,234,.55);opacity:0;transition:opacity .35s;text-shadow:0 2px 10px #000}
.swipeHint.show{opacity:1}

.wordSheet{position:absolute;z-index:20;left:14px;right:14px;bottom:18px;padding:17px 18px 16px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(12,17,21,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 22px 70px rgba(0,0,0,.55);transform:translateY(130%);transition:transform .28s ease}
.wordSheet.show{transform:translateY(0)}
.wordMain{display:flex;align-items:baseline;gap:10px}.wordHan{font-size:27px;font-weight:850}.wordPy{font-size:14px;color:#e7bd73}.wordMean{margin-top:7px;font-size:14px;line-height:1.5;color:#e5e8e9}.wordVi{margin-top:4px;font-size:12px;line-height:1.5;color:#9da8af}.wordClose{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#9da8af;font-size:22px;padding:6px}
.body.wordReady .tapWord{border-bottom:1px dotted rgba(231,189,115,.55);cursor:pointer}
</style>
</head>
<body>
<div class="app">

<section class="screen active" id="home">
  <div class="header"><div class="brand">🌍 地球探索</div><div class="blank"></div></div>
  <div class="homeTitle">选择城市</div>
  <div class="homeCity" onclick="show('beijing')">北京</div>
</section>

<section class="screen" id="beijing">
  <div class="header"><button class="back" onclick="show('home')">‹</button><div class="brand">北京</div><div class="blank"></div></div>
  <div class="beijingMap" aria-label="北京故事地图">
    <div class="mapLabel">北京 · 故事地图</div>
    <button class="mapMark" style="left:50%;top:17%" onclick="startStory('bj001')" aria-label="钟楼：天亮以前的钟楼"><span class="dot"></span><span class="markName">钟楼</span></button>
    <button class="mapMark" style="left:50%;top:49%" onclick="startStory('bj002')" aria-label="前门：前门来了一个外乡人"><span class="dot"></span><span class="markName">前门</span></button>
    <button class="mapMark" style="left:50%;top:75%" onclick="startStory('bj003')" aria-label="天桥：桥下的人声"><span class="dot"></span><span class="markName">天桥</span></button>
    <button class="mapMark disabled" style="left:68%;top:54%" aria-label="什刹海：即将开放"><span class="dot"></span><span class="markName">什刹海</span></button>
    <button class="mapMark disabled" style="left:33%;top:81%" aria-label="琉璃厂：即将开放"><span class="dot"></span><span class="markName">琉璃厂</span></button>
    <div class="mapVignette"></div>
  </div>
  <div class="storyChoices">
    <div class="choice" onclick="startStory('bj001')"><span>天亮以前的钟楼</span><small>钟楼</small></div>
    <div class="choice" onclick="startStory('bj002')"><span>前门来了一个外乡人</span><small>前门 · 大栅栏</small></div>
    <div class="choice" onclick="startStory('bj003')"><span>桥下的人声</span><small>天桥</small></div>
    <div class="choice disabled"><span>什刹海边的夏夜</span><small>即将开放</small></div>
    <div class="choice disabled"><span>一封从琉璃厂寄出的信</span><small>即将开放</small></div>
  </div>
</section>

<section class="screen story" id="story">
  <div class="storyBg" id="storyBg"></div><div class="storyShade"></div><div class="cinemaMeta">STORY CINEMA · 北京</div><div class="swipeHint" id="swipeHint">左右滑动切换场景</div>
  <div class="storyTop">
    <button class="back" onclick="leaveStory()">‹</button>
    <div class="title" id="storyTitle">天亮以前的钟楼</div>
    <div class="count" id="count">1 / 8</div>
  </div>
  <div class="status" id="status">声音 1 · 沉稳男声</div>
  <div class="sceneNav" id="sceneNav" aria-label="场景进度"></div><div class="wordSheet" id="wordSheet" role="dialog" aria-live="polite"><button class="wordClose" onclick="closeWord()">×</button><div class="wordMain"><span class="wordHan" id="wordHan"></span><span class="wordPy" id="wordPy"></span></div><div class="wordMean" id="wordMean"></div><div class="wordVi" id="wordVi"></div></div><div class="storyText">
    <div class="scene" id="scene"></div>
    <div class="body" id="body"></div>
  </div>
  <div class="player">
    <div class="playerGlass">
      <div class="timeRow"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
      <div class="timeline"><div class="timelineBar" id="timelineBar"></div></div>
      <div class="controls">
        <button class="ctrl" onclick="cycleSpeed()"><span id="speed">1.0×</span><small>速度</small></button>
        <button class="play" id="play" onclick="togglePlay()">⏸</button>
        <button class="ctrl" onclick="cycleVoice()"><span id="voice">声音 1</span><small>朗读声音</small></button>
      </div>
    </div>
  </div>
</section>

<audio id="audio" preload="auto" playsinline webkit-playsinline x-webkit-airplay="allow"></audio>
</div>

<script>
const VOICE_NAMES=["声音 1 · 沉稳男声","声音 2 · 温和女声","声音 3 · 年轻平静男声"];

  bj001:{

    voices:[
      "https://dnznrvs05pmza.cloudfront.net/text_to_speech/56850bb7-6dd5-48b6-a2ff-f428a2768325/diqiu_bj001_Elias.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTY2YmU4M2M3OWYxMmRhZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDE5Mjk1Nn0.kwIi6ox2Ln8L_OwLrc0nehlsl_n0vCuWA_YHJgtgmUc",
      "https://dnznrvs05pmza.cloudfront.net/text_to_speech/acd1b5af-aac0-49d4-b6a5-8118e52309f8/diqiu_bj001_Serene.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWQ1MjRhYTQzZjIzNDY5OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDE5MDM3Mn0.wN-RxXRz4_JAtbhWZhVRE5bCNI4AZXMXoGP040tDk0g",
      "https://dnznrvs05pmza.cloudfront.net/text_to_speech/ce5964e2-fb85-4e50-a6c4-671a7be327ce/diqiu_bj001_Frank.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWUyMTY4YjY4NTFhMzA4MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsImV4cCI6MTc5MDE4NzU3NH0.QhIfRcfR1YuPvEVJS4ru6tIz2VU73APtf-4oBCTGku8"
    ],
    images:[
      "assets/scenes/s01-night.svg","assets/scenes/s02-home.svg","assets/scenes/s03-leave.svg","assets/scenes/s04-bell.svg",
      "assets/scenes/s05-wake.svg","assets/scenes/s06-porridge.svg","assets/scenes/s07-city.svg","assets/scenes/s08-end.svg"
    ],
    scenes:[
      {n:"01 · 夜还没退",t:"天还没亮，北京城还安安静静的。风从胡同里慢慢吹过，带着一点秋天的凉意。远远望去，高高的钟楼立在灰蓝色的天边。"},
      {n:"02 · 小安起床",t:"小安已经醒了。他今年十五岁，住在钟楼附近的一条小胡同里。他跟着舅舅一起做早点生意，每天清晨都要早早出门。"},
      {n:"03 · 出门",t:"小安抱着一小捆柴，跟在舅舅后面走出院门。胡同很窄，脚步声在安静的清晨里听得格外清楚。小安问：“舅舅，快到时候了吗？”"},
      {n:"04 · 钟声",t:"“快了。等钟声一响，这城就活了。”他们刚走到钟楼附近，钟声就响了。咚，一声，又一声。声音沉稳、悠长，慢慢传进清冷的空气里。"},
      {n:"05 · 北京慢慢醒了",t:"钟声过后，街上开始慢慢有了人。一个卖烧饼的人挑着担子从胡同口经过。天色一点一点亮起来，空气里也慢慢有了热气和米粥的香味。"},
      {n:"06 · 第一位客人",t:"第一位客人是一个挑担的脚夫。“来一碗热的。”小安小心地盛了一碗粥，双手递过去。那人笑着说：“这天儿啊，还是热粥最暖人。”"},
      {n:"07 · 看着这座城",t:"太阳还没有真正升起来，可天已经比刚才亮了很多。钟楼、屋顶、胡同口，还有远处的街道，都慢慢有了颜色。小安轻轻地说：“北京，又开始新的一天了。”"},
      {n:"08 · 天亮以前的钟楼",t:"舅舅在后面叫他：“小安，别发呆了，快来帮忙！”“来了！”小安转身跑过去。每一天的钟声，都像在告诉他：只要天亮了，日子就会继续往前走。"}
    ]
  },
  bj003:{
    id:"BJ-003",
    title:"桥下的人声",
    city:"北京",
    voices:[
      "https://dnznrvs05pmza.cloudfront.net/text_to_speech/925d426e-f3d1-4daa-851d-e89db504ca67/diqiu_bj003_Elias.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTBjMGZjODRlYzg2ZmIwNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsImV4cCI6MTc5MDEyMzQxMTZ9.jKYQrTn7N9NTariHRkVrZmC_wbs3P3Qhh22nI29hyo8",
      "https://dnznrvs05pmza.cloudfront.net/text_to_speech/8a6ca74b-77bd-4c5f-9995-c23a5f43bdae/diqiu_bj003_Serene.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzg1NzM4NDY2N2JjMTU4MSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDIzMjEzNH0.jIIuVDqNnFF2VkKm7zOCrT5KYZjTZWKcn_a_793Fbys",
      "https://dnznrvs05pmza.cloudfront.net/text_to_speech/34258897-14d0-459d-aa14-071ceaadf6dc/diqiu_bj003_Frank.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjYxODBjNzhmZDU3ZWVlMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsImV4cCI6MTc5MDE4MDA4OH0.S8chR77Id5xyVHmKJ0YFHX6OcdX6NTuS78lnsDmdinM"
    ],
    images:[
      "assets/scenes/bj003-hd/s01.svg","assets/scenes/bj003-hd/s02.svg","assets/scenes/bj003-hd/s03.svg","assets/scenes/bj003-hd/s04.svg",
      "assets/scenes/bj003-hd/s05.svg","assets/scenes/bj003-hd/s06.svg","assets/scenes/bj003-hd/s07.svg","assets/scenes/bj003-hd/s08.svg"
    ],
    scenes:[
      {n:"01 · 木牌掉了",t:"木牌掉下来的时候，阿顺没有听见声音。他只是走了几步，忽然觉得腰间轻了一下。那块木牌不见了。正面写着：德兴布庄。背面还有一行小字：过桥，往南。阿顺站在人群中间，第一次不知道该往哪里走。"},
      {n:"02 · 先找掉东西的地方",t:"他蹲下来找。地上有碎纸、草叶，还有被踩过的布头。没有木牌。走到一个茶摊旁边，他问：“您有没有看见一块木牌？”卖茶的人摇头，又问：“你找德兴布庄？”阿顺点头。“那你往北边找。”"},
      {n:"03 · 天桥下面没有一条路",t:"阿顺按照他说的方向走了一段，又问了一个卖小吃的人。那人说：“德兴布庄我知道。过桥以后往南。”阿顺愣住：“可是刚才有人让我往北。”摊主笑了：“那你刚才问的是谁？他卖茶，又不是卖布。”"},
      {n:"04 · 木牌背后的字",t:"阿顺走到一个卖旧东西的小摊。老人认得德兴布庄，却没有马上告诉他在哪里。“你先记住自己站在哪儿。”阿顺抬头看天桥，又低头想起木牌背后的几个字。他第一次明白，那不是完整的地址，只是一个方向。"},
      {n:"05 · 原来每个人都有自己的天桥",t:"阿顺重新走回桥边。这一次，他没有马上问人。他开始自己看：桥的这一边是什么，另一边是什么，人从哪里来，又往哪里去。他发现，卖茶的人说的北边和卖小吃的人说的南边，都没有错。错的是他没有先知道自己站在哪里。"},
      {n:"06 · 木牌在桌子下面",t:"过桥以后，他一路往南。忽然有人喊：“你的东西是不是这个？”一个孩子站在茶摊旁边，手里拿着那块褐色的小木牌。孩子说，木牌被人踩到，滑到了桌子下面。阿顺接过木牌，重新把它系在腰间。"},
      {n:"07 · 德兴布庄",t:"德兴布庄并不难找。真正难的是，在不知道自己在哪里的时候找到它。阿顺走到门口，把木牌解下来。掌柜看了一眼：“怎么这么晚？”阿顺说：“木牌丢了。”“找到了？”“找到了。”掌柜笑了：“那你今天认识的人，比认识的路还多。”"},
      {n:"08 · 往南",t:"天快黑了。阿顺又走回天桥附近。白天的人声还没有完全散去。有人收摊，有人赶路，有人还在招呼客人。他摸了摸腰间的木牌。以前他只知道这是一个地址。现在，他知道从哪里过桥，往哪里走。然后，他往南走。这一次，他没有问路。"}

const WORDS={
  "钟楼":["zhōng lóu","tower with a bell","tháp chuông"],
  "胡同":["hú tòng","traditional Beijing alley","ngõ / hẻm truyền thống ở Bắc Kinh"],
  "早点":["zǎo diǎn","breakfast / morning food","đồ ăn sáng"],
  "柴":["chái","firewood","củi"],
  "脚夫":["jiǎo fū","porter / laborer carrying goods","người khuân vác"],
  "外乡人":["wài xiāng rén","person from another place","người từ nơi khác đến"],
  "前门":["qián mén","Qianmen, a historic Beijing gate area","Tiền Môn, khu vực cổng lịch sử ở Bắc Kinh"],
  "大栅栏":["dà shí làn","Dashilar, historic commercial area","Đại Sách Lan, khu thương mại lịch sử"],
  "绸布庄":["chóu bù zhuāng","silk and cloth shop","cửa hàng lụa và vải"],
  "门槛":["mén kǎn","door threshold","bậc cửa"],
  "棉衣":["mián yī","padded cotton clothes","áo bông"],
  "炭":["tàn","charcoal","than"],
  "炉火":["lú huǒ","fire in a stove","lửa bếp"],
  "屋檐":["wū yán","eaves","mái hiên"],
  "吆喝":["yāo he","to call out to attract customers","rao hàng"],
  "掌柜":["zhǎng guì","shopkeeper","chủ cửa hàng"]
};
function highlightWords(text, visibleCount=text.length){
  const keys=Object.keys(WORDS).sort((a,b)=>b.length-a.length);
  let out="",i=0,shown=0;
  while(i<text.length){
    let found=null;
    for(const k of keys)if(text.startsWith(k,i)){found=k;break}
    const token=found||text[i];
    const tokenChars=Array.from(token);
    const tokenHtml=tokenChars.map(ch=>{
      const visible=shown<visibleCount;
      shown++;
      return '<span class="karaChar'+(visible?' visible':' future')+'">'+ch.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>';
    }).join('');
    if(found) out+='<span class="tapWord" data-word="'+found+'">'+tokenHtml+'</span>';
    else out+=tokenHtml;
    i+=token.length;
  }
  return out;
}
function renderTextProgress(t){
  const s=story();
  if(sceneIndex<0||sceneIndex>=s.scenes.length)return;
  const starts=sceneStarts();
  const start=starts[sceneIndex]||0;
  const end=(sceneIndex<s.scenes.length-1)?starts[sceneIndex+1]:(audio.duration||start+1);
  const duration=Math.max(.2,end-start);
  const ratio=Math.max(0,Math.min(1,(t-start)/duration));
  const text=s.scenes[sceneIndex].t;
  const visibleCount=Math.max(1,Math.min(text.length,Math.floor(text.length*ratio)));
  const body=document.getElementById("body");
  body.innerHTML=highlightWords(text,visibleCount);
  body.classList.add("wordReady");
  bindWordLongPress();
}
function bindWordLongPress(){
  document.querySelectorAll(".tapWord").forEach(el=>{
    let timer=null;
    const start=()=>{timer=setTimeout(()=>openWord(el.dataset.word),420)};
    const cancel=()=>{if(timer){clearTimeout(timer);timer=null}};
    el.addEventListener("touchstart",start,{passive:true});
    el.addEventListener("touchend",cancel,{passive:true});
    el.addEventListener("touchcancel",cancel,{passive:true});
    el.addEventListener("mousedown",start);
    el.addEventListener("mouseup",cancel);
    el.addEventListener("mouseleave",cancel);
    el.addEventListener("click",()=>openWord(el.dataset.word));
  });
}
function openWord(word){
  const d=WORDS[word];if(!d)return;
  document.getElementById("wordHan").textContent=word;
  document.getElementById("wordPy").textContent=d[0];
  document.getElementById("wordMean").textContent=d[1];
  document.getElementById("wordVi").textContent=d[2];
  document.getElementById("wordSheet").classList.add("show");
}
function closeWord(){document.getElementById("wordSheet").classList.remove("show")}

const audio=document.getElementById("audio");
const speeds=[.8,1,1.2,1.5];
let storyKey="bj001",voiceIndex=0,speedIndex=1,sceneIndex=-1;
let speechMode=false,speechVoices=[],speechVoiceIndex=0;

function story(){return STORIES[storyKey]}
function weights(){return story().scenes.map(s=>s.t.replace(/[\s“”。，！？：；、]/g,"").length+10)}

function ensurePlaybackSession(){
  try{
    if("audioSession" in navigator)navigator.audioSession.type="playback";
  }catch(e){}
}
ensurePlaybackSession();

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.documentElement.style.overflow=id==="story"?"hidden":"";
  document.body.style.overflow=id==="story"?"hidden":"";
}

function startStory(key){
  ensurePlaybackSession();
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
  storyKey=key;
  voiceIndex=0;
  speedIndex=1;
  sceneIndex=-1;
  const s=story();

  speechMode=false;
  document.getElementById("story").classList.toggle("speechMode",speechMode);
  audio.pause();
  audio.src=s.voices[voiceIndex];
  audio.preload="auto";
  audio.load();
  audio.playbackRate=speeds[speedIndex];

  document.getElementById("storyTitle").textContent=s.title;
  document.getElementById("speed").textContent="1.0×";
  renderScene(0);
  show("story");
  updateVoiceUI();
  setupMedia();
  showSwipeHint();
  if(speechMode){
    prepareSpeechVoices();
    document.getElementById("play").textContent="⏸";
    speakScene(0);
  }else{
    audio.play().catch(()=>{document.getElementById("play").textContent="▶"});
  }
}

function leaveStory(){
  audio.pause();
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
  document.getElementById("story").classList.remove("speechMode");
  show("beijing")
}

function resumePlayback(){
  ensurePlaybackSession();
  if(audio.ended)audio.currentTime=0;
  const p=audio.play();
  if(p&&typeof p.catch==="function")p.catch(()=>{document.getElementById("play").textContent="▶"});
  return p;
}

function togglePlay(){
  if(speechMode){
    if(!("speechSynthesis" in window))return;
    if(window.speechSynthesis.paused){window.speechSynthesis.resume();document.getElementById("play").textContent="⏸";return}
    if(window.speechSynthesis.speaking){window.speechSynthesis.pause();document.getElementById("play").textContent="▶";return}
    speakScene(sceneIndex<0?0:sceneIndex);
    return;
  }
  if(audio.ended)audio.currentTime=0;
  if(audio.paused)resumePlayback();else audio.pause();
}

function cycleSpeed(){
  speedIndex=(speedIndex+1)%speeds.length;
  document.getElementById("speed").textContent=speeds[speedIndex].toFixed(1)+"×";
  audio.playbackRate=speeds[speedIndex];
}

function cycleVoice(){
  const s=story();
  if(speechMode){
    prepareSpeechVoices();
    if(speechVoices.length){
      speechVoiceIndex=(speechVoiceIndex+1)%speechVoices.length;
      voiceIndex=(speechVoiceIndex%3);
      updateVoiceUI();
      if(window.speechSynthesis.speaking||window.speechSynthesis.paused){
        window.speechSynthesis.cancel();
        speakScene(sceneIndex<0?0:sceneIndex);
      }
    }
    return;
  }
  const oldTime=audio.currentTime||0;
  const oldStarts=sceneStarts();
  const oldScene=sceneForTime(oldTime);
  const oldSceneStart=oldStarts[oldScene]||0;
  const oldSceneEnd=(oldScene<oldStarts.length-1)?oldStarts[oldScene+1]:(audio.duration||oldSceneStart+1);
  const sceneRatio=Math.max(0,Math.min(1,(oldTime-oldSceneStart)/Math.max(.2,oldSceneEnd-oldSceneStart)));
  const wasPlaying=!audio.paused;
  voiceIndex=(voiceIndex+1)%s.voices.length;
  audio.src=s.voices[voiceIndex];
  audio.preload="auto";
  audio.load();
  audio.playbackRate=speeds[speedIndex];
  updateVoiceUI();
  setupMedia();
  const restoreVoicePosition=()=>{
    if(audio.duration&&isFinite(audio.duration)){
      const newStarts=sceneStarts();
      const newStart=newStarts[oldScene]||0;
      const newEnd=(oldScene<newStarts.length-1)?newStarts[oldScene+1]:audio.duration;
      audio.currentTime=Math.max(0,Math.min(audio.duration-0.05,newStart+sceneRatio*Math.max(.2,newEnd-newStart)));
      sceneIndex=-1;
      renderScene(oldScene);
      renderTextProgress(audio.currentTime);
    }
    if(wasPlaying)resumePlayback();
  };
  if(audio.readyState>=1)restoreVoicePosition();
  else audio.addEventListener("loadedmetadata",restoreVoicePosition,{once:true});
}

function prepareSpeechVoices(){
  if(!("speechSynthesis" in window))return;
  const all=window.speechSynthesis.getVoices();
  speechVoices=all.filter(v=>/^zh/i.test(v.lang));
  if(!speechVoices.length)speechVoices=all;
  if(speechVoiceIndex>=speechVoices.length)speechVoiceIndex=0;
}
function speakScene(i){
  if(!("speechSynthesis" in window))return;
  const s=story();
  if(i<0||i>=s.scenes.length)return;
  window.speechSynthesis.cancel();
  renderScene(i);
  const u=new SpeechSynthesisUtterance(s.scenes[i].t);
  prepareSpeechVoices();
  if(speechVoices.length)u.voice=speechVoices[speechVoiceIndex];
  u.rate=speeds[speedIndex];
  u.pitch=1;
  u.lang=(u.voice&&u.voice.lang)||"zh-CN";
  u.onstart=()=>{document.getElementById("play").textContent="⏸"};
  u.onend=()=>{if(sceneIndex<i)return;if(i<s.scenes.length-1){speakScene(i+1)}else{document.getElementById("play").textContent="↻"}};
  window.speechSynthesis.speak(u);
}
if("speechSynthesis" in window)window.speechSynthesis.onvoiceschanged=prepareSpeechVoices;

function updateVoiceUI(){
  document.getElementById("voice").textContent="声音 "+(voiceIndex+1);
  const s=document.getElementById("status");
  s.textContent=VOICE_NAMES[voiceIndex];
  s.classList.add("show");
  setTimeout(()=>s.classList.remove("show"),1300);
}

function sceneStarts(){
  if(!audio.duration||!isFinite(audio.duration))return [0];
  const ws=weights();
  const total=ws.reduce((a,b)=>a+b,0);
  let acc=0;
  const out=[0];
  for(let i=0;i<ws.length-1;i++){
    acc+=ws[i];
    out.push(audio.duration*(acc/total));
  }
  return out;
}

function sceneForTime(t){
  const starts=sceneStarts();
  let i=0;
  for(let n=0;n<starts.length;n++){if(t>=starts[n])i=n;else break}
  return i;
}

function renderScene(i){
  const s=story();
  if(i<0||i>=s.scenes.length)return;
  if(i===sceneIndex && document.getElementById("body").textContent)return;
  sceneIndex=i;
  document.getElementById("storyBg").style.backgroundImage='url("'+s.images[i]+'")';
  document.getElementById("scene").textContent=s.scenes[i].n;
  document.getElementById("body").innerHTML=highlightWords(s.scenes[i].t);
  document.getElementById("body").classList.add("wordReady");
  bindWordLongPress();
  document.getElementById("count").textContent=(i+1)+" / "+s.scenes.length;
  renderSceneNav();
  preloadScene(i+1);
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:s.title,
      artist:"地球探索 · "+s.city,
      album:s.scenes[i].n,
      artwork:[{src:new URL(s.images[i],location.href).href,sizes:"512x512",type:"image/svg+xml"}]
    });
  }
}
function renderSceneNav(){
  const nav=document.getElementById("sceneNav");
  if(!nav)return;
  nav.innerHTML="";
  story().scenes.forEach((_,i)=>{
    const b=document.createElement("button");
    b.className="sceneDot"+(i===sceneIndex?" active":"");
    b.setAttribute("aria-label","第 "+(i+1)+" 幕");
    b.onclick=()=>jumpToScene(i);
    nav.appendChild(b);
  });
}
function preloadScene(i){
  const s=story();
  if(i>=0&&i<s.images.length){const img=new Image();img.src=s.images[i]}
}
function jumpToScene(i){
  const s=story();
  if(i<0||i>=s.scenes.length)return;
  if(speechMode){speakScene(i);return}
  const starts=sceneStarts();
  if(starts[i]!=null)audio.currentTime=Math.min(audio.duration||starts[i],starts[i]+.05);
  renderScene(i);
}


function seekScene(delta){
  const s=story();
  const target=Math.max(0,Math.min(s.scenes.length-1,sceneForTime(audio.currentTime)+delta));
  const starts=sceneStarts();
  if(starts[target]!=null)audio.currentTime=starts[target]+.05;
}

function setupMedia(){
  if(!("mediaSession" in navigator))return;
  ensurePlaybackSession();
  const s=story();
  navigator.mediaSession.metadata=new MediaMetadata({
    title:s.title,
    artist:"地球探索 · "+s.city,
    album:VOICE_NAMES[voiceIndex]
  });
  const handlers={
    play:()=>{ensurePlaybackSession();resumePlayback()},
    pause:()=>audio.pause(),
    previoustrack:()=>seekScene(-1),
    nexttrack:()=>seekScene(1),
    seekbackward:(d)=>{audio.currentTime=Math.max(0,audio.currentTime-(d.seekOffset||10));renderTextProgress(audio.currentTime)},
    seekforward:(d)=>{audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+(d.seekOffset||10));renderTextProgress(audio.currentTime)}
  };
  Object.entries(handlers).forEach(([k,v])=>{try{navigator.mediaSession.setActionHandler(k,v)}catch(e){}});
}

function fmt(s){
  if(!isFinite(s)||s<0)s=0;
  const m=Math.floor(s/60),r=Math.floor(s%60);
  return m+":"+String(r).padStart(2,"0");
}

audio.addEventListener("loadedmetadata",()=>{
  audio.playbackRate=speeds[speedIndex];
  renderScene(sceneForTime(audio.currentTime||0));
  setupMedia();
});

audio.addEventListener("canplay",()=>document.getElementById("status").classList.remove("show"));

audio.addEventListener("waiting",()=>{
  const s=document.getElementById("status");
  s.textContent="正在缓冲…";
  s.classList.add("show");
});

audio.addEventListener("stalled",()=>{
  const s=document.getElementById("status");
  s.textContent="网络较慢，正在恢复…";
  s.classList.add("show");
});

audio.addEventListener("timeupdate",()=>{
  const d=audio.duration||0,t=audio.currentTime||0;
  document.getElementById("timelineBar").style.width=(d?t/d*100:0)+"%";
  document.getElementById("elapsed").textContent=fmt(t);
  document.getElementById("remaining").textContent="-"+fmt(Math.max(0,d-t));
  renderScene(sceneForTime(t));
  renderTextProgress(t);
  if("mediaSession" in navigator && navigator.mediaSession.setPositionState && d&&isFinite(d)){
    try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate,position:Math.min(t,d)})}catch(e){}
  }
});

audio.addEventListener("play",()=>{
  document.getElementById("play").textContent="⏸";
  if("mediaSession" in navigator)navigator.mediaSession.playbackState="playing";
});
audio.addEventListener("pause",()=>{
  document.getElementById("play").textContent="▶";
  if("mediaSession" in navigator)navigator.mediaSession.playbackState="paused";
});
audio.addEventListener("ended",()=>{
  document.getElementById("play").textContent="↻";
  audio.currentTime=0;
  sceneIndex=-1;
  renderScene(0);
});

document.addEventListener("visibilitychange",()=>{
  ensurePlaybackSession();
  if(!document.hidden){
    document.getElementById("play").textContent=audio.paused?"▶":"⏸";
    audio.playbackRate=speeds[speedIndex];
  }
});

let touchX=0,touchY=0;
const storyEl=document.getElementById("story");
storyEl.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  touchX=e.touches[0].clientX; touchY=e.touches[0].clientY;
},{passive:true});
storyEl.addEventListener("touchend",e=>{
  if(!touchX)return;
  const dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
  touchX=touchY=0;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.25)return;
  const target=Math.max(0,Math.min(story().scenes.length-1,sceneIndex+(dx<0?1:-1)));
  if(target!==sceneIndex)jumpToScene(target);
});
function showSwipeHint(){
  const el=document.getElementById("swipeHint"); if(!el)return;
  el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1800);
}
window.addEventListener("pageshow",()=>{
  ensurePlaybackSession();
  document.getElementById("play").textContent=audio.paused?"▶":"⏸";
  audio.playbackRate=speeds[speedIndex];
});

try{
  if("audioSession" in navigator && navigator.audioSession.addEventListener){
    navigator.audioSession.addEventListener("statechange",()=>ensurePlaybackSession());
  }
}catch(e){}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
