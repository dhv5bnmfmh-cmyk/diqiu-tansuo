<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a"><title>地球探索 · 北京</title>
<style>
:root{--bg:#05070a;--ink:#f5f0e7;--muted:#9aa4aa;--gold:#d8ad67;--line:#ffffff16}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit}.app{width:min(480px,100vw);min-height:100vh;margin:auto;background:var(--bg);overflow:hidden;position:relative}
.screen{display:none;min-height:100vh}.screen.on{display:block}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.04em}.back{border:0;background:none;font-size:30px;padding:8px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.hero{padding:28px 22px 20px}.hero h1{font-size:42px;margin:8px 0 8px;letter-spacing:-.04em}.hero p{color:var(--muted);line-height:1.7;margin:0}
.world{height:54vh;min-height:400px;margin:8px 14px 0;border:1px solid var(--line);border-radius:28px;overflow:hidden;position:relative;background:radial-gradient(circle at 52% 45%,#193447 0,#0c202c 28%,#071117 58%,#040608 100%)}
.world:before{content:"";position:absolute;inset:7% 5%;border-radius:50%;background:repeating-radial-gradient(ellipse at center,#ffffff10 0 1px,transparent 1px 42px);transform:rotate(-12deg)}
.world:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 32%,#02040799 78%,#020407 100%)}
.continent{position:absolute;background:#9eab7b22;border:1px solid #d8ad6740;filter:blur(.2px);transform:rotate(-12deg);z-index:2}
.asia{width:240px;height:150px;left:40%;top:25%;border-radius:55% 45% 58% 42%}.europe{width:125px;height:75px;left:25%;top:20%;border-radius:55% 40% 55% 45%}.africa{width:110px;height:170px;left:35%;top:48%;border-radius:48% 55% 45% 50%}.americas{width:130px;height:300px;left:8%;top:28%;border-radius:60% 35% 45% 50%}
.pin{position:absolute;z-index:5;left:61%;top:37%;border:0;background:none;cursor:pointer}.pin i{display:block;width:16px;height:16px;background:var(--gold);border:4px solid #f2ddb08c;border-radius:50%;box-shadow:0 0 0 8px #d8ad671c,0 0 28px #d8ad6780}.pin span{display:block;margin-top:7px;font-size:11px;text-shadow:0 2px 10px #000}
.worldHint{position:absolute;z-index:5;left:20px;bottom:18px;font-size:11px;color:#c5ccd0}.cities{padding:20px 22px 36px}.city{display:flex;justify-content:space-between;align-items:center;padding:19px 0;border-bottom:1px solid var(--line);font-size:21px;font-weight:750;cursor:pointer}.city small{font-size:10px;color:#737e84;font-weight:500}.locked{opacity:.28}
.beijingHero{margin:18px 16px 0;height:34vh;min-height:280px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(145deg,#2a2117,#11110e 48%,#050608);border:1px solid var(--line)}
.beijingHero:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 38%,#8d5e2c22 39% 45%,transparent 46%),linear-gradient(180deg,#8f683233,#0000 55%,#000b)}
.arch{position:absolute;left:15%;right:15%;bottom:0;height:62%;border:8px solid #c59b5a66;border-bottom:0;border-radius:50% 50% 0 0}.arch:before,.arch:after{content:"";position:absolute;bottom:0;width:18%;height:75%;background:#c59b5a30}.arch:before{left:10%}.arch:after{right:10%}
.beijingTitle{position:absolute;left:22px;bottom:20px}.beijingTitle h1{font-size:40px;margin:3px 0}.stories{padding:18px 22px}.storyRow{padding:17px 0;border-bottom:1px solid var(--line);cursor:pointer}.storyRow b{font-size:19px}.storyRow small{display:block;color:var(--muted);margin-top:5px;font-size:11px}
.reader{position:fixed;inset:0;z-index:20;background:#05070a;display:none}.reader.on{display:block}.readerBg{position:absolute;inset:-3%;background:linear-gradient(135deg,#3b3022,#10171a 52%,#040506);transition:1.2s;transform:scale(1.04)}.readerBg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004 0,#0000 35%,#02040755 58%,#020407 100%)}
.readerTop{position:absolute;z-index:3;top:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.readerText{position:absolute;z-index:3;left:24px;right:24px;bottom:160px}.readerText .eyebrow{color:var(--gold)}.readerText h2{font-size:29px;margin:7px 0 14px;line-height:1.2}.copy{font-family:"Noto Serif SC","Songti SC",serif;font-size:21px;line-height:1.8;text-shadow:0 3px 20px #000}.char{opacity:0;filter:blur(3px);transition:opacity .28s,filter .28s}.char.show{opacity:1;filter:none}
.player{position:absolute;z-index:4;left:12px;right:12px;bottom:12px;padding-bottom:env(safe-area-inset-bottom)}.glass{padding:12px 14px 10px;border:1px solid #ffffff1a;border-radius:25px;background:#0d1318dd;backdrop-filter:blur(22px)}.bar{height:3px;background:#ffffff18;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}.controls{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;height:64px}.ctrl{border:0;background:none;font-size:14px;font-weight:700}.ctrl small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#17120b;font-size:22px;justify-self:center}.note{font-size:10px;color:#aeb6ba;margin:8px 3px 0}
.fade{animation:fade 1.1s both}@keyframes fade{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:none}}
</style>
</head>
<body>
<div class="app">
<section id="home" class="screen on">
<div class="top"><div class="brand">🌍 地球探索</div><div class="eyebrow">WORLD</div></div>
<div class="hero"><div class="eyebrow">从一个地方开始</div><h1>世界的故事</h1><p>地图不是终点。点开一个地方，让它从时间深处慢慢开口。</p></div>
<div class="world">
<div class="continent americas"></div><div class="continent europe"></div><div class="continent africa"></div><div class="continent asia"></div>
<button class="pin" onclick="openChina()"><i></i><span>中国</span></button><div class="worldHint">第一站 · 中国</div>
</div>
</section>
<section id="china" class="screen">
<div class="top"><button class="back" onclick="go('home')">‹</button><div class="brand">中国</div><div class="eyebrow">CHINA</div></div>
<div class="hero"><div class="eyebrow">中国 · 城市</div><h1>从北京开始</h1><p>先走进一座城市，再走进它的时间。</p></div>
<div class="cities">
<div class="city" onclick="go('beijing')">北京 <small>开放 · 第一章</small></div>
<div class="city locked">西安 <small>即将开放</small></div><div class="city locked">南京 <small>即将开放</small></div><div class="city locked">杭州 <small>即将开放</small></div>
</div>
</section>
<section id="beijing" class="screen">
<div class="top"><button class="back" onclick="go('china')">‹</button><div class="brand">北京</div><div class="eyebrow">BEIJING</div></div>
<div class="beijingHero"><div class="arch"></div><div class="beijingTitle"><div class="eyebrow">城市故事</div><h1>北京</h1><div class="eyebrow">古代 · 近代 · 今天</div></div></div>
<div class="stories">
<div class="storyRow" onclick="playStory(0)"><b>天亮以前的钟楼</b><small>一座城市醒来以前，钟声先醒了。</small></div>
<div class="storyRow" onclick="playStory(1)"><b>前门来了一个外乡人</b><small>一个人第一次走进北京，先认识的是一条街。</small></div>
<div class="storyRow" onclick="playStory(2)"><b>紫禁城：墙里面的时间</b><small>从宫门、屋檐到今天的故宫，六百年缓缓经过。</small></div>
</div>
</section>
<div id="reader" class="reader">
<div id="readerBg" class="readerBg"></div>
<div class="readerTop"><button class="back" onclick="closeReader()">‹</button><div id="rTitle" class="brand"></div><div id="rCount" class="eyebrow"></div></div>
<div class="readerText"><div id="rEra" class="eyebrow"></div><h2 id="rScene"></h2><div id="rCopy" class="copy"></div></div>
<div class="player"><div class="glass"><div class="bar"><i id="progress"></i></div><div class="controls"><button class="ctrl" onclick="speed()">1.0×<small>速度</small></button><button id="play" class="play" onclick="toggle()">▶</button><button class="ctrl" onclick="voice()">声音 1<small>朗读声音</small></button></div><div class="note">文字会跟随朗读慢慢出现 · 点击场景可切换</div></div></div>
</div>
</div>
<script>
const stories=[
{title:"天亮以前的钟楼",era:"北京 · 清晨",scenes:["天还没亮，北京城还安安静静的。风从胡同里慢慢吹过，远远望去，高高的钟楼立在灰蓝色的天边。","钟声响了。咚，一声，又一声。声音沉稳、悠长，慢慢传进清冷的空气里。","钟声过后，街上开始有了人。烧饼的香气、炉火的热气和脚步声，一点一点把北京叫醒。","太阳还没有真正升起来，可天已经亮了。钟楼、屋顶、胡同口，都慢慢有了颜色。北京，又开始了新的一天。"]},
{title:"前门来了一个外乡人",era:"北京 · 前门",scenes:["阿顺第一次来到北京时，手里只有一封信、一件棉衣，还有母亲塞给他的几个铜钱。","前门比他想象中更热闹。街两边有布庄、茶铺、药铺，伙计的吆喝声和车轮声混在一起。","他拿着纸条问路。有人说往北，有人说往南。直到一个茶铺伙计告诉他：先记住自己站在哪里。","天黑以后，他终于找到那家小布庄。北京没有一下子变成他的城市，但那条路、那家铺子和明天要做的事情，已经成了新生活的开始。"]},
{title:"紫禁城：墙里面的时间",era:"北京 · 紫禁城",scenes:["六百多年前，北京城的中心，开始出现一片新的宫城。后来，人们称它为紫禁城。","宫墙把里面和外面分开，也把时间一层层留在了建筑里。门、屋檐、广场和殿宇，都有自己的秩序。","这里曾经是明清两代皇宫。皇帝、宫人、工匠和无数普通劳动者，都在不同的位置留下过痕迹。","今天，紫禁城已经成为故宫博物院。墙还是墙，屋檐还是屋檐，但走进这里的人，已经不再是过去的人。时间没有停下，只是换了一种方式继续。"]}
];
let si=0,ci=0,rate=1,voiceIndex=0,speaking=false,paused=false,wordTimer;
const synth=window.speechSynthesis;
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}
function openChina(){go('china')}
function playStory(i){si=i;ci=0;document.getElementById('reader').classList.add('on');document.getElementById('rTitle').textContent=stories[si].title;document.getElementById('rCount').textContent='01 / 04';render();speak()}
function render(){const s=stories[si];document.getElementById('rEra').textContent=s.era;document.getElementById('rScene').textContent='';document.getElementById('rCopy').innerHTML=s.scenes[ci].split('').map(c=>'<span class="char">'+c.replace(/</g,'&lt;')+'</span>').join('');document.getElementById('rCount').textContent=String(ci+1).padStart(2,'0')+' / '+String(s.scenes.length).padStart(2,'0');document.getElementById('readerBg').style.background=ci%2?'linear-gradient(145deg,#3a2a1b,#101a1d 52%,#040506)':'linear-gradient(145deg,#24343b,#151817 52%,#050607)';setTimeout(()=>document.querySelectorAll('.char').forEach((x,n)=>setTimeout(()=>x.classList.add('show'),n*24)),80)}
function speak(){if(!synth)return; synth.cancel(); const u=new SpeechSynthesisUtterance(stories[si].scenes[ci]);u.lang='zh-CN';u.rate=rate;u.pitch=1;const vs=synth.getVoices().filter(v=>/^zh/i.test(v.lang));if(vs.length)u.voice=vs[voiceIndex%vs.length];u.onstart=()=>{speaking=true;paused=false;document.getElementById('play').textContent='❚❚'};u.onend=()=>{speaking=false;if(ci<stories[si].scenes.length-1){ci++;render();speak()}else document.getElementById('play').textContent='↻'};synth.speak(u)}
function toggle(){if(!synth)return;if(synth.speaking&&!synth.paused){synth.pause();paused=true;document.getElementById('play').textContent='▶'}else if(synth.paused){synth.resume();paused=false;document.getElementById('play').textContent='❚❚'}else speak()}
function speed(){rate=rate===1?1.25:rate===1.25?1.5:.8;document.querySelector('.ctrl').firstChild.textContent=rate.toFixed(2).replace('.00','')+'×';if(speaking)speak()}
function voice(){voiceIndex++;if(speaking)speak()}
function closeReader(){synth.cancel();document.getElementById('reader').classList.remove('on')}
window.speechSynthesis?.addEventListener?.('voiceschanged',()=>{});
</script>
</body></html>
