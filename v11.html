<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>地球探索</title>
<style>
:root{
  --bg:#05080b;--ink:#f7f3ea;--muted:#9da8af;--gold:#e7bd73;
  --glass:rgba(16,22,27,.70);--line:rgba(255,255,255,.10)
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.app{width:min(470px,100vw);min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;min-height:100vh;position:relative}.screen.active{display:block}
.header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.055)}
.brand{font-size:19px;font-weight:850;letter-spacing:.01em}
.back{border:0;background:transparent;color:#fff;font-size:29px;padding:8px 10px}.blank{width:48px}
.homeTitle{font-size:12px;color:var(--muted);letter-spacing:.14em;padding:36px 22px 10px}
.homeCity{font-size:36px;font-weight:860;padding:18px 22px 26px;cursor:pointer}
.list{padding:6px 22px 34px}
.row{min-height:78px;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.075);font-size:22px;font-weight:730;cursor:pointer}
.row:active,.homeCity:active{opacity:.58}.row.disabled{opacity:.3;cursor:default}

/* story */
.story.active{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(470px,100vw);height:100dvh;min-height:100dvh;overflow:hidden;overscroll-behavior:none}
.storyBg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);transition:background-image .6s ease,transform 8s ease}
.story.active .storyBg{transform:scale(1.07)}
.storyShade{position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.01) 34%,rgba(2,5,8,.18) 50%,rgba(2,5,8,.70) 72%,#020508 100%)}
.storyTop{position:absolute;z-index:5;left:0;right:0;top:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 17px}
.title{font-size:14px;font-weight:760;text-shadow:0 1px 12px rgba(0,0,0,.65)}
.count{font-size:12px;color:#d2d7da}
.storyText{position:absolute;z-index:4;left:25px;right:25px;bottom:158px}
.scene{font-size:11px;color:var(--gold);letter-spacing:.11em;margin-bottom:10px;font-weight:760}
.body{font-size:21px;line-height:1.68;text-shadow:0 2px 16px rgba(0,0,0,.68)}
.player{position:absolute;z-index:8;left:0;right:0;bottom:0;padding:6px 14px calc(13px + env(safe-area-inset-bottom))}
.playerGlass{
  background:linear-gradient(180deg,rgba(26,32,37,.78),rgba(12,17,21,.91));
  border:1px solid rgba(255,255,255,.11);box-shadow:0 18px 55px rgba(0,0,0,.35);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:26px;padding:12px 14px 10px
}
.timeline{height:3px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin:0 5px 11px}
.timelineBar{height:100%;width:0;background:linear-gradient(90deg,#e6b767,#f2d49a);border-radius:999px}
.timeRow{display:flex;justify-content:space-between;color:#89959c;font-size:10px;margin:0 4px 2px}
.controls{height:64px;display:grid;grid-template-columns:1fr 78px 1fr;align-items:center}
.ctrl{border:0;background:transparent;color:#f5f3ed;font-size:14px;font-weight:760;height:58px;border-radius:18px}
.ctrl:active{background:rgba(255,255,255,.06)}
.ctrl small{display:block;color:#87949b;font-size:9px;font-weight:650;margin-top:3px}
.play{width:58px;height:58px;border-radius:50%;border:0;justify-self:center;background:linear-gradient(145deg,#f0ddb3,#dcb974);color:#1c1711;font-size:22px;font-weight:900;box-shadow:0 7px 24px rgba(226,185,111,.25)}
.status{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:6;font-size:10px;color:#d9dfe2;background:rgba(0,0,0,.32);padding:6px 10px;border-radius:999px;backdrop-filter:blur(12px);opacity:0;transition:.25s;pointer-events:none}
.status.show{opacity:1}
</style>
</head>
<body>
<div class="app">

<section class="screen active" id="home">
  <div class="header"><div class="brand">🌍 地球探索</div><div class="blank"></div></div>
  <div class="homeTitle">选择城市</div>
  <div class="homeCity" onclick="show('beijing')">北京</div>
</section>

<section class="screen" id="beijing">
  <div class="header"><button class="back" onclick="show('home')">‹</button><div class="brand">北京</div><div class="blank"></div></div>
  <div class="list">
    <div class="row" onclick="startStory()">天亮以前的钟楼</div>
    <div class="row disabled">前门来了一个外乡人</div>
  </div>
</section>

<section class="screen story" id="story">
  <div class="storyBg" id="storyBg"></div><div class="storyShade"></div>
  <div class="storyTop">
    <button class="back" onclick="leaveStory()">‹</button>
    <div class="title">天亮以前的钟楼</div>
    <div class="count" id="count">1 / 8</div>
  </div>
  <div class="status" id="status">声音 1 · 沉稳男声</div>
  <div class="storyText">
    <div class="scene" id="scene"></div>
    <div class="body" id="body"></div>
  </div>
  <div class="player">
    <div class="playerGlass">
      <div class="timeRow"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
      <div class="timeline"><div class="timelineBar" id="timelineBar"></div></div>
      <div class="controls">
        <button class="ctrl" onclick="cycleSpeed()"><span id="speed">1.0×</span><small>速度</small></button>
        <button class="play" id="play" onclick="togglePlay()">⏸</button>
        <button class="ctrl" onclick="cycleVoice()"><span id="voice">声音 1</span><small>朗读声音</small></button>
      </div>
    </div>
  </div>
</section>

<audio id="audio" preload="metadata" playsinline></audio>
</div>

<script>
const VOICES=["https://dnznrvs05pmza.cloudfront.net/text_to_speech/5d29a0f4-3dc9-4bbe-9b60-7fb854317e19/BJ001___1_____.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTM2YWEzYzI2NGNkNzBjNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg5MDI0Mn0.H6O0eIbEqWyvcbub8pjgkJQa03C6L0Mwp8-NrNhDgkk","https://dnznrvs05pmza.cloudfront.net/text_to_speech/016b5747-ab50-4a4b-9575-8c77d3a995fa/BJ001___2_____.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzZmY2Q1MGRhODNhNDllYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTkxMTE4MX0.lFAmmFqIWF6gAeOIkZ5c2zkTmZRaXdFC-I4SeODtKFU","https://dnznrvs05pmza.cloudfront.net/text_to_speech/cb0ea6d4-8274-4a3d-be45-9e870ce1968d/BJ001___3_______.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGM5OTQ5Njk3NTMwYjlhOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTgyNTY0MX0.0kbLpDgR0C7T5OooV2ub1TewNIYvrqJ1ZHKM0SBg5mY"];
const VOICE_NAMES=["声音 1 · 沉稳男声","声音 2 · 温和女声","声音 3 · 年轻平静男声"];
const images=[
'assets/scenes/s01-night.svg','assets/scenes/s02-home.svg','assets/scenes/s03-leave.svg','assets/scenes/s04-bell.svg',
'assets/scenes/s05-wake.svg','assets/scenes/s06-porridge.svg','assets/scenes/s07-city.svg','assets/scenes/s08-end.svg'
];
const scenes=[
{n:"01 · 夜还没退",t:"天还没亮，北京城还安安静静的。风从胡同里慢慢吹过，带着一点秋天的凉意。远远望去，高高的钟楼立在灰蓝色的天边。"},
{n:"02 · 小安起床",t:"小安已经醒了。他今年十五岁，住在钟楼附近的一条小胡同里。他跟着舅舅一起做早点生意，每天清晨都要早早出门。"},
{n:"03 · 出门",t:"小安抱着一小捆柴，跟在舅舅后面走出院门。胡同很窄，脚步声在安静的清晨里听得格外清楚。小安问：“舅舅，快到时候了吗？”"},
{n:"04 · 钟声",t:"“快了。等钟声一响，这城就活了。”他们刚走到钟楼附近，钟声就响了。咚，一声，又一声。声音沉稳、悠长，慢慢传进清冷的空气里。"},
{n:"05 · 北京慢慢醒了",t:"钟声过后，街上开始慢慢有了人。一个卖烧饼的人挑着担子从胡同口经过。天色一点一点亮起来，空气里也慢慢有了热气和米粥的香味。"},
{n:"06 · 第一位客人",t:"第一位客人是一个挑担的脚夫。“来一碗热的。”小安小心地盛了一碗粥，双手递过去。那人笑着说：“这天儿啊，还是热粥最暖人。”"},
{n:"07 · 看着这座城",t:"太阳还没有真正升起来，可天已经比刚才亮了很多。钟楼、屋顶、胡同口，还有远处的街道，都慢慢有了颜色。小安轻轻地说：“北京，又开始新的一天了。”"},
{n:"08 · 天亮以前的钟楼",t:"舅舅在后面叫他：“小安，别发呆了，快来帮忙！”“来了！”小安转身跑过去。每一天的钟声，都像在告诉他：只要天亮了，日子就会继续往前走。"}
];
const weights=scenes.map(s=>s.t.replace(/[\s“”。，！？：；、]/g,"").length+10);
const totalWeight=weights.reduce((a,b)=>a+b,0);
const audio=document.getElementById("audio");
let voiceIndex=0,speedIndex=1,sceneIndex=-1;
const speeds=[.8,1,1.2,1.5];

function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.documentElement.style.overflow=id==="story"?"hidden":"";
 document.body.style.overflow=id==="story"?"hidden":"";
}
function startStory(){
 voiceIndex=0;speedIndex=1;sceneIndex=-1;
 audio.src=VOICES[voiceIndex];audio.playbackRate=speeds[speedIndex];
 show("story");updateVoiceUI();setupMedia();
 audio.play().catch(()=>{document.getElementById("play").textContent="▶"});
}
function leaveStory(){audio.pause();show("beijing")}
function togglePlay(){audio.paused?audio.play():audio.pause()}
function cycleSpeed(){speedIndex=(speedIndex+1)%speeds.length;audio.playbackRate=speeds[speedIndex];document.getElementById("speed").textContent=speeds[speedIndex].toFixed(1)+"×"}
function cycleVoice(){
 const ratio=(audio.duration&&isFinite(audio.duration))?audio.currentTime/audio.duration:0;
 const wasPlaying=!audio.paused;
 voiceIndex=(voiceIndex+1)%VOICES.length;
 audio.src=VOICES[voiceIndex];
 audio.playbackRate=speeds[speedIndex];
 updateVoiceUI();setupMedia();
 audio.addEventListener("loadedmetadata",function once(){
   audio.removeEventListener("loadedmetadata",once);
   if(audio.duration&&isFinite(audio.duration))audio.currentTime=ratio*audio.duration;
   if(wasPlaying)audio.play();
 },{once:true});
}
function updateVoiceUI(){
 document.getElementById("voice").textContent="声音 "+(voiceIndex+1);
 const s=document.getElementById("status");s.textContent=VOICE_NAMES[voiceIndex];s.classList.add("show");setTimeout(()=>s.classList.remove("show"),1300);
}
function sceneStarts(){
 if(!audio.duration||!isFinite(audio.duration))return [0];
 let acc=0;const out=[0];
 for(let i=0;i<weights.length-1;i++){acc+=weights[i];out.push(audio.duration*(acc/totalWeight))}
 return out;
}
function sceneForTime(t){
 const starts=sceneStarts();let i=0;
 for(let n=0;n<starts.length;n++){if(t>=starts[n])i=n;else break}
 return i;
}
function renderScene(i){
 if(i===sceneIndex)return;sceneIndex=i;
 document.getElementById("storyBg").style.backgroundImage='url("'+images[i]+'")';
 document.getElementById("scene").textContent=scenes[i].n;
 document.getElementById("body").textContent=scenes[i].t;
 document.getElementById("count").textContent=(i+1)+" / "+scenes.length;
 if("mediaSession" in navigator){
   navigator.mediaSession.metadata=new MediaMetadata({
     title:"天亮以前的钟楼",
     artist:"地球探索 · 北京",
     album:scenes[i].n,
     artwork:[{src:new URL(images[i],location.href).href,sizes:"512x512",type:"image/svg+xml"}]
   });
 }
}
function seekScene(delta){
 const target=Math.max(0,Math.min(scenes.length-1,sceneForTime(audio.currentTime)+delta));
 const starts=sceneStarts();if(starts[target]!=null)audio.currentTime=starts[target]+.05;
}
function setupMedia(){
 if(!("mediaSession" in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:"天亮以前的钟楼",artist:"地球探索 · 北京",album:VOICE_NAMES[voiceIndex]});
 const handlers={
  play:()=>audio.play(),pause:()=>audio.pause(),
  previoustrack:()=>seekScene(-1),nexttrack:()=>seekScene(1),
  seekbackward:(d)=>audio.currentTime=Math.max(0,audio.currentTime-(d.seekOffset||10)),
  seekforward:(d)=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+(d.seekOffset||10))
 };
 Object.entries(handlers).forEach(([k,v])=>{try{navigator.mediaSession.setActionHandler(k,v)}catch(e){}});
}
function fmt(s){if(!isFinite(s)||s<0)s=0;const m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+String(r).padStart(2,"0")}
audio.addEventListener("loadedmetadata",()=>{renderScene(0);setupMedia()});
audio.addEventListener("timeupdate",()=>{
 const d=audio.duration||0,t=audio.currentTime||0;
 document.getElementById("timelineBar").style.width=(d?t/d*100:0)+"%";
 document.getElementById("elapsed").textContent=fmt(t);
 document.getElementById("remaining").textContent="-"+fmt(Math.max(0,d-t));
 renderScene(sceneForTime(t));
 if("mediaSession" in navigator && navigator.mediaSession.setPositionState && d&&isFinite(d)){
  try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate,position:Math.min(t,d)})}catch(e){}
 }
});
audio.addEventListener("play",()=>{document.getElementById("play").textContent="⏸";if("mediaSession" in navigator)navigator.mediaSession.playbackState="playing"});
audio.addEventListener("pause",()=>{document.getElementById("play").textContent="▶";if("mediaSession" in navigator)navigator.mediaSession.playbackState="paused"});
audio.addEventListener("ended",()=>{document.getElementById("play").textContent="↻";audio.currentTime=0;renderScene(0)});
</script>
</body>
</html>
